services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: viloyatga_bорамiz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d viloyatga_bорамiz"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  bot:
    build: ./bot
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    profiles: ["bot"]
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
volumes:
  postgres_data:
